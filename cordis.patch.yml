# The local plugin source bundle patch: one host row carrying both halves.
#
# It lists the local plugin folder inside the app (Settings > Plugins >
# Local plugins) and installs/removes those bundles through the profile's own
# Plugin Manager, so a locally developed plugin can be installed at any time
# without leaving the app.
#
# The row names its own entry file, patch-relative: app-boot converts a
# `./` path to a file URL against this file, which keeps the row independent
# of how the enclosing package happens to be linked into the profile.
#
# No `disabled` expression, on purpose. The loader evaluates such an expression
# while it builds the entry tree — before any plugin has applied — so it can only
# read services that already exist at that moment (app-boot's own, such as
# `profileContext`). Probing a plugin-provided service like `webServer` therefore
# evaluates to disabled on every cold start and never recovers, because `refresh()`
# returns early for a disabled entry until the tree is rebuilt.
# The host half injects the web surface optionally, so a profile without a
# webserver activates the row and simply registers no route.
- insert:
    - id: local-plugin-source
      name: "./lib/manager.js"
